[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncs-mcp"
version = "0.1.0"
description = "NCS structured knowledge database and MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "requests>=2.32,<3",
  "python-dotenv>=1,<2",
]

[project.urls]
Homepage = "https://ncs-mcp-bridge-mini2.vercel.app"
Repository = "https://github.com/koul777/HRMCP"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ncs-mcp = "ncs_mcp.server:main"
ncs-institutional-chat = "ncs_mcp.institutional_chat:main"
