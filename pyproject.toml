[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncs-mcp"
version = "0.1.0"
description = "NCS structured knowledge database and MCP server"
requires-python = ">=3.11"
dependencies = [
  "mcp",
  "openpyxl",
  "requests",
  "python-dotenv",
  "Pillow",
  "PyMuPDF",
  "pypdf",
  "pytesseract",
  "olefile",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ncs-mcp = "ncs_mcp.server:main"
