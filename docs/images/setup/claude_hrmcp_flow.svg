<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude에서 HRMCP를 활성화하고 요청하는 메뉴 흐름</title>
  <desc id="desc">검색 및 도구 열기, 커넥터 선택, HRMCP 활성화, 문서 첨부 후 자연어 요청의 네 단계</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="1" stop-color="#f7eee6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6b4b3e" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#cc6b4a"/>
    </marker>
    <style>
      .title { font: 700 44px Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #2f2926; }
      .badge { font: 600 21px Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #a34e35; }
      .step { font: 700 23px Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #ffffff; }
      .card-title { font: 700 27px Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #2f2926; }
      .card-sub { font: 500 19px Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #6b625d; }
      .note { font: 600 21px Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #514943; }
    </style>
  </defs>

  <rect width="1600" height="620" rx="32" fill="url(#background)"/>
  <text x="72" y="84" class="title">Claude에서 HRMCP 사용하기</text>
  <rect x="1110" y="41" width="418" height="54" rx="27" fill="#f4ded3"/>
  <text x="1319" y="76" text-anchor="middle" class="badge">메뉴 흐름 안내 · 실제 UI 화면 아님</text>

  <g filter="url(#shadow)">
    <rect x="72" y="148" width="318" height="258" rx="24" fill="#ffffff" stroke="#ead8ce"/>
    <circle cx="118" cy="196" r="25" fill="#cc6b4a"/>
    <text x="118" y="204" text-anchor="middle" class="step">1</text>
    <g transform="translate(122 246)" stroke="#cc6b4a" stroke-width="7" stroke-linecap="round">
      <line x1="0" y1="0" x2="72" y2="0"/><circle cx="23" cy="0" r="9" fill="#ffffff"/>
      <line x1="0" y1="28" x2="72" y2="28"/><circle cx="51" cy="28" r="9" fill="#ffffff"/>
      <line x1="0" y1="56" x2="72" y2="56"/><circle cx="34" cy="56" r="9" fill="#ffffff"/>
    </g>
    <text x="231" y="337" text-anchor="middle" class="card-title">검색 및 도구 열기</text>
    <text x="231" y="372" text-anchor="middle" class="card-sub">슬라이더 아이콘 · + · /</text>

    <rect x="452" y="148" width="318" height="258" rx="24" fill="#ffffff" stroke="#ead8ce"/>
    <circle cx="498" cy="196" r="25" fill="#cc6b4a"/>
    <text x="498" y="204" text-anchor="middle" class="step">2</text>
    <rect x="546" y="234" width="130" height="78" rx="18" fill="#f7e5dc" stroke="#cc6b4a" stroke-width="3"/>
    <path d="M579 255h64M579 273h64M579 291h40" stroke="#cc6b4a" stroke-width="6" stroke-linecap="round"/>
    <text x="611" y="337" text-anchor="middle" class="card-title">커넥터 선택</text>
    <text x="611" y="372" text-anchor="middle" class="card-sub">Connectors 영역</text>

    <rect x="832" y="148" width="318" height="258" rx="24" fill="#ffffff" stroke="#ead8ce"/>
    <circle cx="878" cy="196" r="25" fill="#cc6b4a"/>
    <text x="878" y="204" text-anchor="middle" class="step">3</text>
    <text x="991" y="260" text-anchor="middle" class="card-title">HRMCP</text>
    <rect x="939" y="278" width="104" height="52" rx="26" fill="#cc6b4a"/>
    <circle cx="1016" cy="304" r="20" fill="#ffffff"/>
    <text x="991" y="363" text-anchor="middle" class="card-title">이 대화에서 켜기</text>

    <rect x="1212" y="148" width="318" height="258" rx="24" fill="#ffffff" stroke="#ead8ce"/>
    <circle cx="1258" cy="196" r="25" fill="#cc6b4a"/>
    <text x="1258" y="204" text-anchor="middle" class="step">4</text>
    <path d="M1320 244h104v72h-104zM1338 263h68M1338 281h68M1338 299h44" fill="none" stroke="#cc6b4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1371" y="350" text-anchor="middle" class="card-title">문서 첨부 후 요청</text>
    <text x="1371" y="382" text-anchor="middle" class="card-sub">@HRMCP 입력 불필요</text>
  </g>

  <path d="M398 277H438" stroke="#cc6b4a" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M778 277H818" stroke="#cc6b4a" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1158 277H1198" stroke="#cc6b4a" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="72" y="464" width="1458" height="94" rx="22" fill="#f4ded3"/>
  <circle cx="117" cy="511" r="20" fill="#cc6b4a"/>
  <text x="117" y="519" text-anchor="middle" class="step">!</text>
  <text x="157" y="505" class="note">HRMCP가 보이지 않으면 사용자 정의(Customize) → 커넥터(Connectors)에서 먼저 연결하세요.</text>
  <text x="157" y="537" class="card-sub">화면 구성은 Claude 버전, 언어, 플랜 및 기능 롤아웃에 따라 달라질 수 있습니다.</text>
</svg>
